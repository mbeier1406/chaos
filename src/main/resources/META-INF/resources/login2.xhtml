<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/templates/layout.xhtml">

    <ui:define name="title">Container Login</ui:define>
    <ui:define name="pageTitle">Container-basierter Login</ui:define>
    <ui:define name="pageDescription">Jakarta EE Container Security</ui:define>
    
    <ui:define name="content">
        <p:panel header="Login (Container Security)" styleClass="ui-panel-shadow">
            <!-- Reines HTML-Form für j_security_check -->
            <form method="POST" action="j_security_check">
                <div style="margin-bottom: 1rem;">
                    <label for="j_username">Benutzername:</label><br/>
                    <input type="text" 
                           id="j_username" 
                           name="j_username" 
                           required="required"
                           style="width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 3px;" />
                </div>
                
                <div style="margin-bottom: 1rem;">
                    <label for="j_password">Passwort:</label><br/>
                    <input type="password" 
                           id="j_password" 
                           name="j_password" 
                           required="required"
                           style="width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 3px;" />
                </div>
                
                <button type="submit" 
                        style="background-color: #007bff; color: white; padding: 0.5rem 1rem; border: none; border-radius: 3px; cursor: pointer;">
                    Login
                </button>
            </form>
            
            <p style="margin-top: 1rem; color: #666;">
                <strong>Hinweis:</strong> Verwenden Sie den User <code>admin</code> aus der users.properties
            </p>
        </p:panel>
    </ui:define>
    
</ui:composition>
